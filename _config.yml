# GitHub Pages(Jekyll) 게시 범위 설정
#
# Pages 사이트 크기 한도는 1 GB다. 이 저장소는 Drive 배포용 사본(한글 폴더·날짜 붙은 파일)과
# 원고(.md)·도구 스크립트까지 담고 있어 전체를 게시하면 한도를 넘어 deploy가 실패한다.
# 저장소·Drive 파일은 그대로 두고, 웹에 필요 없는 것만 Pages 빌드에서 뺀다.
#
# 게시 대상: index.html · about.html · readme.html · auth.js · images/
#            루트 영문 페이지(<영문명>.html) · 영문 별칭 폴더(<영문명>/index.html)
# 새 문헌의 한글 폴더·날짜 사본을 추가하면 아래 목록에도 넣는다.

exclude:
  # 원고·도구·문서(웹에서 링크하지 않음)
  - "*.md"
  - "*.py"
  - "*.bat"
  - "*.txt"
  # 한글 폴더(Drive 배포용 사본)
  - "경락학_교감_마스터/"
